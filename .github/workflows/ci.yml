name: CI

on:
  push:
    branches:
      - lab2
  pull_request:
    branches:
      - main
      - lab1

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore CarWash.slnx

      - name: Build
        run: dotnet build CarWash.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test --solution CarWash.slnx --no-build --configuration Release
